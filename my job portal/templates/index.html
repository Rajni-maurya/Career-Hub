<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar { background: #1e3a8a; }
        .job-card:hover { transform: scale(1.02); transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #chat-container { position: fixed; bottom: 20px; right: 20px; width: 320px; z-index: 1000; }
        .chat-window { height: 300px; overflow-y: auto; background: #f8f9fa; border: 1px solid #ddd; padding: 10px; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark p-3">
    <div class="container d-flex justify-content-between">
        <span class="navbar-brand h1">CS Career Hub</span>
        <div class="text-white">Welcome, {{ username }} | <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a></div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-6">
            <h3>Featured Jobs</h3>
            {% for job in jobs %}
            <div class="card job-card mb-3 p-3">
                <h5>{{ job.title }}</h5>
                <p class="text-muted">{{ job.company }} • {{ job.location }}</p>
                <div class="d-flex justify-content-between">
                    <span class="badge bg-success pt-2">{{ job.salary }}</span>
                    <button class="btn btn-primary btn-sm">Apply Now</button>
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="col-md-6">
            <h3>AI Resume Analyzer</h3>
            <div class="ratio ratio-4x3 shadow-sm rounded">
                <iframe src="https://resume-analyzer-ai-l7d7.onrender.com" class="rounded"></iframe>
            </div>
        </div>
    </div>
</div>

<!-- Chatbot -->
<div id="chat-container" class="card shadow">
    <div class="card-header bg-primary text-white">AI Assistant</div>
    <div class="chat-window" id="chatBox"></div>
    <div class="input-group">
        <input type="text" id="userMsg" class="form-control" placeholder="Type here...">
        <button class="btn btn-primary" onclick="sendChat()">Send</button>
    </div>
</div>

<script>
    async function sendChat() {
        let input = document.getElementById('userMsg');
        let box = document.getElementById('chatBox');
        if(!input.value) return;
        box.innerHTML += `<div class="text-end mb-2"><span class="bg-primary text-white p-2 rounded d-inline-block">${input.value}</span></div>`;
        let res = await fetch('/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: input.value}) });
        let data = await res.json();
        box.innerHTML += `<div class="mb-2"><span class="bg-secondary text-white p-2 rounded d-inline-block">${data.reply}</span></div>`;
        input.value = ""; box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
