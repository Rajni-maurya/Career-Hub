<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - CS Career Hub</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8fafc; /* Same light gray background as register */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            border-top: 5px solid #1e3a8a; /* Same blue top border */
        }
        .btn-primary {
            background: #1e3a8a; /* Deep blue button */
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #152b6d;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #e2e8f0;
        }
        h3 {
            color: #1e3a8a;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h3>Welcome Back</h3>
        <p class="text-muted">Login to access your dashboard</p>
    </div>
    
    <!-- Login Form -->
    <form action="/login" method="POST">
        <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
        </div>
        <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 shadow-sm">Login</button>
    </form>

    <div class="text-center mt-4">
        <span class="text-muted small">Don't have an account?</span> 
        <a href="/register" class="text-decoration-none small fw-bold" style="color: #1e3a8a;">Register here</a>
    </div>
</div>

</body>
</html>
