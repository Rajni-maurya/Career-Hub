<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - CS Career Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 420px;
            border-top: 5px solid #1e3a8a;
        }
        .btn-success {
            background: #10b981;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }
        .form-control { border-radius: 10px; padding: 12px; }
        h3 { color: #1e3a8a; font-weight: 700; }
    </style>
</head>
<body>

<div class="register-card">
    <div class="text-center mb-4">
        <h3>Join the Hub</h3>
        <p class="text-muted">Analyze your career path today.</p>
    </div>
    <form action="/register" method="POST">
        <div class="mb-3">
            <label class="form-label text-secondary">Choose Username</label>
            <input type="text" name="username" class="form-control" placeholder="e.g. Rahul123" required>
        </div>
        <div class="mb-4">
            <label class="form-label text-secondary">Set Password</label>
            <input type="password" name="password" class="form-control" placeholder="Min. 8 characters" required>
        </div>
        <button type="submit" class="btn btn-success w-100 shadow-sm">Create My Account</button>
    </form>
    <div class="text-center mt-4">
        <span class="text-muted small">Already a member?</span> 
        <a href="/login" class="text-decoration-none small fw-bold" style="color: #1e3a8a;">Login Now</a>
    </div>
</div>

</body>
</html>
