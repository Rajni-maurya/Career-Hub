<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Hub | AI-Powered Job Portal</title>
    
    <!-- External CSS: Bootstrap & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        /* Global Variables & Theme */
        :root { 
            --primary-blue: #1e3a8a; 
            --accent-blue: #3b82f6;
            --light-bg: #f8fafc; 
            --text-dark: #1e293b;
        }

        body { 
            background-color: var(--light-bg); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }
        
        /* Navbar Customization */
        .navbar { 
            background: white; 
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 0;
        }
        .navbar-brand { font-size: 1.5rem; letter-spacing: 1px; }
        .nav-link { 
            color: #475569 !important; 
            font-weight: 500; 
            margin: 0 10px;
            transition: 0.3s; 
        }
        .nav-link:hover { color: var(--primary-blue) !important; }

        /* Floating Chatbot Icon (Bottom Right) */
        #chat-icon { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            width: 65px; 
            height: 65px; 
            background: var(--primary-blue); 
            color: white; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 30px; 
            cursor: pointer; 
            z-index: 1001; 
            box-shadow: 0 8px 25px rgba(30, 58, 138, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #chat-icon:hover { transform: scale(1.1) rotate(10deg); }

        /* Chat Window UI */
        #chat-window { 
            position: fixed; 
            bottom: 110px; 
            right: 30px; 
            width: 380px; 
            display: none; 
            z-index: 1000; 
            border: none; 
            border-radius: 20px; 
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .chat-header { 
            background: var(--primary-blue); 
            color: white; 
            padding: 18px; 
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* Message Layouts */
        .chat-body {
            height: 380px; 
            overflow-y: auto; 
            background: #ffffff;
            padding: 20px;
        }
        .ai-profile-icon {
            width: 35px; height: 35px; 
            background: var(--primary-blue); 
            color: white; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 10px; 
            margin-right: 12px;
            flex-shrink: 0;
        }
        .chat-msg-row { display: flex; align-items: flex-start; margin-bottom: 20px; }
        .msg-content { 
            background: #f1f5f9; 
            padding: 12px 16px; 
            border-radius: 18px 18px 18px 2px; 
            font-size: 14px; 
            color: #334155;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            line-height: 1.5;
        }
        
        /* User Specific Messages */
        .user-msg-row { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .user-msg-content { 
            background: var(--primary-blue); 
            color: white; 
            padding: 12px 16px; 
            border-radius: 18px 18px 2px 18px; 
            font-size: 14px;
            max-width: 80%;
            box-shadow: 0 4px 10px rgba(30, 58, 138, 0.2);
        }

        /* Quick Suggestion Buttons */
        .suggestion-container { padding: 10px; text-align: center; border-top: 1px solid #f1f5f9; }
        .suggestion-btn { 
            font-size: 11px; 
            border-radius: 20px; 
            margin: 3px; 
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue); 
            background: white;
            padding: 6px 12px;
            transition: 0.2s;
            font-weight: 500;
        }
        .suggestion-btn:hover { background: var(--accent-blue); color: white; }

        .chat-footer { padding: 15px; background: white; border-top: 1px solid #f1f5f9; }
        
        /* Custom Scrollbar */
        .chat-body::-webkit-scrollbar { width: 6px; }
        .chat-body::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Professional Navigation Bar -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/"><i class="bi bi-briefcase-fill"></i> CAREER HUB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/jobs">Jobs</a></li>
                    <li class="nav-item"><a class="nav-link" href="/analyzer">AI Analyzer</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tracking">Tracking</a></li>
                    <li class="nav-item"><a href="/logout" class="nav-link">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content Block (Where other pages load) -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Floating AI Chatbot Icon -->
    <div id="chat-icon" onclick="toggleChat()">
        <i class="bi bi-robot"></i>
    </div>

    <!-- Chatbot Window -->
    <div id="chat-window" class="card shadow-lg">
        <div class="chat-header">
            <span><i class="bi bi-stars"></i> Career Assistant AI</span>
            <button class="btn-close btn-close-white" onclick="toggleChat()" aria-label="Close"></button>
        </div>
        
        <div class="chat-body" id="chatBody">
            <!-- AI Welcome Message -->
            <div class="chat-msg-row">
                <div class="ai-profile-icon shadow-sm">AI</div>
                <div class="msg-content shadow-sm">
                    Hello! Main Career Hub ka AI assistant hoon. Main aapki application track karne ya resume analyze karne mein madad kar sakta hoon.
                </div>
            </div>
        </div>

        <!-- Predefined Quick Actions -->
        <div class="suggestion-container">
            <button class="suggestion-btn" onclick="autoChat('Track my last application')">Track My Application</button>
            <button class="suggestion-btn" onclick="autoChat('Analyze my resume score')">Check Resume Score</button>
            <button class="suggestion-btn" onclick="autoChat('Search for Java Developer jobs')">Find Java Jobs</button>
        </div>

        <div class="chat-footer">
            <div class="input-group">
                <input type="text" id="userMsg" class="form-control border-0 bg-light px-3" style="border-radius: 25px 0 0 25px;" placeholder="Ask anything...">
                <button class="btn btn-primary px-3" style="border-radius: 0 25px 25px 0;" onclick="sendChat()">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Core Javascript Logic -->
    <script>
        // Toggle Chat Window visibility
        function toggleChat() {
            const win = document.getElementById('chat-window');
            if (win.style.display === 'none' || win.style.display === '') {
                win.style.display = 'block';
            } else {
                win.style.display = 'none';
            }
        }

        // Send Message Function
        async function sendChat(manualMsg = null) {
            const input = document.getElementById('userMsg');
            const msg = manualMsg || input.value;
            if (!msg) return;

            const chatBody = document.getElementById('chatBody');
            
            // 1. Display User Message in UI
            chatBody.innerHTML += `
                <div class="user-msg-row">
                    <div class="user-msg-content shadow-sm">${msg}</div>
                </div>`;
            
            input.value = "";
            chatBody.scrollTop = chatBody.scrollHeight;

            // 2. Fetch Response from Backend (Flask /chat route)
            try {
                const response = await fetch('/chat', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({message: msg}) 
                });
                const data = await response.json();
                
                // 3. Display AI Response with Icon
                chatBody.innerHTML += `
                    <div class="chat-msg-row">
                        <div class="ai-profile-icon shadow-sm">AI</div>
                        <div class="msg-content shadow-sm">${data.reply}</div>
                    </div>`;
                chatBody.scrollTop = chatBody.scrollHeight;
            } catch (error) {
                console.error("Error communicating with AI:", error);
            }
        }

        // Trigger message via suggestion buttons
        function autoChat(msg) {
            sendChat(msg);
        }
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
